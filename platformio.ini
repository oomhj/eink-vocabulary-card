; PlatformIO 工程配置 — ESP8266 墨水屏单词卡
; 主控：ESP8266（如 ESP-12F）
; 屏幕：2.13" SSD1680（HINK-E0266A15-A0）
; 来源：从 TTGO_T5_V2.3_2.13 项目复用词库/工具/固件逻辑移植

[env:esp8266]
platform = espressif8266
framework = arduino
board = esp12e

; 实测：GigaDevice GD25Q32 支持 QIO；DIO 模式下 flash 高地址数据直读会 LoadStoreError
; （代码执行正常、数据读取 ~230KB 以上崩）。先试 QIO 是否修复直读。
board_build.flash_mode = qio
; 26.7MHz（实测定论 2026-08）：GD25Q32 QIO@40MHz + 连屏(GPIO15 strap 低, boot mode 3,6) 间歇性
;   pll_cal exceeds 2ms + boot 卡死——screen-test 固件 40MHz 实测：一次卡死在 rf cal 后（固件未启动），
;   一次正常。26.7MHz 连屏反复 RST 均干净，与 eink-album 一致，勿再撤回（69453aa 记录同因）。
board_build.f_flash = 26700000L

; screen-test 分支：仅屏幕测试固件（screen_test.cpp，无词库/单词卡逻辑）；
;   hink_e0213.cpp/.h  = 自定义 GxEPD2 类（IL3895 HINK-E0213A04-G01，VCOM 0x2C=0x18）
; 切回 main 分支时恢复 +<*> -<word_cards_ref.cpp>
build_src_filter = +<word_cards.cpp> +<hink_e0213.cpp>

; U8g2_for_Adafruit_GFX 只对 AVR 把字体放进 flash；ESP8266 下 const 字体默认进 .rodata(RAM)。
; 强制在所有编译单元前 -include src/u8g2_fonts_flash.h，把字体重定位到 flash 的 .irom.text
; （wqy16/wqy14 中文约 500KB，不这么做 80KB RAM 会溢出）
; 注：库编译不自动带 -Isrc，需显式加上（编译 cwd=项目根目录）
build_flags =
    -Isrc
    -include u8g2_fonts_flash.h

upload_speed = 460800
monitor_speed = 74880  ; 对齐 ESP8266 boot ROM（74880），配合固件 Serial.begin(74880) 可同时看清 rst cause 与 [wc] 日志

; 词库约 247KB，需选 4MB 模组并开大 flash 分区
board_build.filesystem = littlefs
board_build.partitions = huge_app.csv

lib_deps =
    zinggjm/GxEPD2@^1.6.9
    olikraus/U8g2_for_Adafruit_GFX@^1.0.1
